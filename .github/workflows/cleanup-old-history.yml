name: Remove old releases and tags

# 기록을 새로 쓴 뒤, 옛 기록(예전 앱 서명 키 포함)을 가리키는 태그·릴리스를 지우는 일회용 작업
on:
  push:
    branches: [ccr-9a189999-ocfg87]
    paths: ['.github/workflows/cleanup-old-history.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Delete tags and releases outside the new history
        run: |
          git fetch --force --tags origin
          for t in $(git tag); do
            if git merge-base --is-ancestor "$t" origin/ccr-9a189999-ocfg87 2>/dev/null; then
              echo "keep $t"
            else
              echo "delete $t"
              gh release delete "$t" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || git push origin ":refs/tags/$t"
            fi
          done
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName' |
            while read -r t; do gh release delete "$t" --yes -R "$GITHUB_REPOSITORY" || true; done
          echo "== remaining tags"; git ls-remote --tags origin
