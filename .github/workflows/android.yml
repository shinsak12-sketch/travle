name: Android APK

on:
  push:
    branches: [main, ccr-9a189999-ocfg87]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/model_test.dart

      # 저장소 Secrets에 서명 키가 있으면 고정 키로 서명 (업데이트 설치 가능), 없으면 디버그 키
      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<PROPS
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - run: flutter build apk --release --build-number $((100 + ${{ github.run_number }}))

      - run: cp build/app/outputs/flutter-apk/app-release.apk build/travle-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: travle-apk
          path: app/build/travle-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 트래블 앱 빌드 ${{ github.run_number }}
          body: 폰에서 아래 travle-${{ github.run_number }}.apk 를 받아 설치
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: app/build/travle-${{ github.run_number }}.apk
